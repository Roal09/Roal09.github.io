<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 技能中心 · 离线交互演示</title>
<link rel="stylesheet" href="element.css">
<link rel="stylesheet" href="main.css">
<link rel="stylesheet" href="skills.css">
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#f7f3ea}
  .skill-shell{min-height:100%}
  a.icon-btn{display:grid;place-items:center;text-decoration:none}
  .demo-notice{margin:0 0 18px;padding:12px 14px;border:1px solid rgba(49,90,79,.2);border-radius:8px;background:#eef2e8;color:#315a4f;font-size:13px;line-height:1.65}
  .demo-notice strong{display:block;margin-bottom:3px}
  .sample-note,.demo-status{font-size:12px;line-height:1.7;color:#53635a}
  .sample-note{margin:0 0 8px}
  .demo-status{min-height:21px;margin:0 0 10px}
  .empty-result{flex-direction:column;gap:10px}
  .empty-result span{font-size:13px}
  .history-item > div{flex-wrap:wrap}
  .history-item p{white-space:pre-wrap;overflow-wrap:anywhere}
  button:focus-visible,a:focus-visible{outline:3px solid #c9822c;outline-offset:3px}
</style>
</head>
<body>
<div id="app" class="skill-shell">
  <header class="skill-topbar">
    <a href="../index.html#hmdp" target="_top" aria-label="返回项目介绍" class="icon-btn"><i class="el-icon-arrow-left" aria-hidden="true"></i></a>
    <div><div class="eyebrow">LocalPilot AI · 离线演示</div><h1>AI技能中心</h1></div>
    <button type="button" id="refresh-records" aria-label="刷新本次会话记录" title="刷新本次会话记录" class="icon-btn"><i class="el-icon-refresh" aria-hidden="true"></i></button>
  </header>
  <aside class="demo-notice">
    <strong>离线交互演示 · 预设样例</strong>
    选择技能并播放样例，体验完整操作流程。店铺名称可替换；其余字段用于展示表单，不会触发模型分析。全部内容仅为示例。
  </aside>
  <main class="skill-main">
    <section class="skill-rail" aria-label="选择 AI 技能"></section>
    <section class="skill-workbench" aria-label="技能操作区">
      <div class="panel-head">
        <div><span class="skill-scene"></span><h2></h2></div>
        <button type="button" id="clear-result" class="ghost-btn"><i class="el-icon-delete" aria-hidden="true"></i>清空结果</button>
      </div>
      <div class="dynamic-form"></div>
      <div class="action-row">
        <button type="button" class="run-btn"><i class="el-icon-video-play" aria-hidden="true"></i><span>播放示例</span></button>
        <button type="button" id="copy-result" disabled class="ghost-btn"><i class="el-icon-document-copy" aria-hidden="true"></i>复制</button>
      </div>
      <p class="sample-note">结果使用预设内容，仅替换店名，不代表真实店铺情况。未连接大模型或业务系统。</p>
      <p id="demo-status" class="demo-status" role="status" aria-live="polite"></p>
      <div class="empty-result"><i class="el-icon-edit-outline" aria-hidden="true"></i><span>选择技能，点击“播放示例”查看结果</span></div>
      <pre class="result-box" hidden tabindex="0" aria-label="预设样例结果"></pre>
    </section>
  </main>
  <section class="run-history" aria-label="本次会话记录">
    <div class="panel-head compact"><h2>本次播放记录</h2><span id="history-count">0 条</span></div>
    <p class="sample-note">仅保留当前页面最近 5 次完整播放，刷新页面后清空。</p>
    <div class="history-list"></div>
  </section>
</div>
<script>
(function () {
  'use strict';
  var SKILLS = [
  {
    "s": "用户",
    "n": "AI写探店笔记",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "体验关键词",
        "招牌菜、环境、服务、人均",
        "area"
      ],
      [
        "文风",
        "真实、有烟火气"
      ]
    ],
    "o": "【探店笔记】\n\n今天打卡了「示例茶餐厅」，整体体验围绕招牌菜、环境和服务展开。\n\n推荐理由：\n· 招牌菜出餐稳定，特色菜有记忆点\n· 环境适合拍照，桌面间距宽松\n· 人均 68 元，适合朋友小聚\n\n避坑提醒：\n· 晚市高峰需排队，建议提前到店\n· 部分套餐需两人起订"
  },
  {
    "s": "商家",
    "n": "AI总结店铺评价",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "评价原文",
        "环境好，菜有点咸，服务及时",
        "area"
      ]
    ],
    "o": "评价摘要\n\n优势：\n· 环境舒适、适合拍照\n· 服务响应及时\n\n待优化：\n· 部分菜品口味偏咸，建议调整出品标准\n\n适合人群：\n· 朋友聚会、周末放松\n· 对拍照和环境有要求的客群"
  },
  {
    "s": "商家",
    "n": "AI生成评价回复",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "用户评价",
        "环境不错，就是上菜有点慢",
        "area"
      ],
      [
        "回复语气",
        "真诚"
      ]
    ],
    "o": "您好，非常感谢您的反馈，也抱歉让您等待。\n\n我们已记录出餐节奏的问题，会在高峰时段增加出品岗位并优化流程。\n\n期待您下次到店能有更好的体验。"
  },
  {
    "s": "商家",
    "n": "AI生成优惠券文案",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "优惠力度",
        "满 100 减 30"
      ],
      [
        "目标人群",
        "情侣 / 朋友聚会"
      ]
    ],
    "o": "券标题：双人套餐限时立减 30 元\n副标题：招牌菜组合，到店即享\n\n推广话术：\n周末不知道吃什么？双人套餐一次打卡招牌菜，到店立减 30 元，适合约会与小聚。"
  },
  {
    "s": "商家",
    "n": "AI提取店铺标签",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "店铺描述",
        "环境好，出片，人均 68，适合聚会",
        "area"
      ]
    ],
    "o": "推荐标签：\n高性价比 · 适合拍照 · 朋友聚会 · 招牌菜 · 环境舒适 · 周末可选 · 地铁附近 · 适合约会"
  },
  {
    "s": "商家",
    "n": "AI生成经营日报",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "今日数据",
        "客流 132，核销券 26 张，评分 4.8",
        "area"
      ]
    ],
    "o": "经营日报\n\n今日表现：\n· 客流 132 人，核销券 26 张，转化正常\n· 评分维持 4.8，口碑稳定\n\n风险提醒：\n· 晚市 18:30-19:30 排队较久\n\n明日建议：\n· 提前备货高峰菜品\n· 主推双人套餐券承接周末流量"
  },
  {
    "s": "商家",
    "n": "AI生成短视频脚本",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "卖点",
        "招牌菜、环境"
      ],
      [
        "视频时长",
        "30 秒"
      ]
    ],
    "o": "短视频脚本（30s）\n\n0-3s 门头特写，字幕：周末就吃这家\n3-11s 招牌菜出锅画面，口播：这一口是招牌\n11-20s 环境空镜，口播：环境宽松，适合聊天\n20-27s 两人用餐画面，口播：人均 68 吃得踏实\n27-30s 结尾引导：到店出示本条视频领小食"
  },
  {
    "s": "商家",
    "n": "AI生成活动方案草稿",
    "f": [
      [
        "店铺名称",
        "示例茶餐厅"
      ],
      [
        "活动目标",
        "提升周末客流"
      ],
      [
        "预算",
        "3000 元"
      ]
    ],
    "o": "活动方案草稿\n\n主题：周末双人套餐季\n\n步骤：\n1. 上线双人套餐券，限时限量\n2. 探店笔记 5 篇 + 短视频 2 条扩散\n3. 到店核销赠送小食，提升复购\n\n预算分配：券补贴 2000 元，内容 600 元，物料 400 元\n周期：3-5 天\n\n（本方案需商家确认后执行）"
  }
];
  var rail = document.querySelector('.skill-rail');
  var work = document.querySelector('.skill-workbench');
  var head = work.querySelector('.panel-head');
  var form = work.querySelector('.dynamic-form');
  var runBtn = work.querySelector('.run-btn');
  var runLabel = runBtn.querySelector('span');
  var copyBtn = document.getElementById('copy-result');
  var box = work.querySelector('.result-box');
  var empty = work.querySelector('.empty-result');
  var status = document.getElementById('demo-status');
  var historyList = document.querySelector('.history-list');
  var records = [];
  var cards = [];
  var current = 0;
  var timer = null;
  var result = '';
  var HISTORY_LIMIT = 5;
  var PLAY_INTERVAL_MS = 16;
  var PLAY_STEP = 3;

  function announce(message) {
    status.textContent = message;
  }

  function stopPlayback() {
    if (timer !== null) window.clearInterval(timer);
    timer = null;
    runBtn.disabled = false;
    runLabel.textContent = '播放示例';
    work.setAttribute('aria-busy', 'false');
  }

  function clearResult() {
    stopPlayback();
    result = '';
    box.textContent = '';
    box.hidden = true;
    empty.hidden = false;
    empty.style.display = '';
    copyBtn.disabled = true;
  }

  function renderHistory() {
    historyList.replaceChildren();
    document.getElementById('history-count').textContent = records.length + ' 条';
    if (!records.length) {
      var message = document.createElement('p');
      message.className = 'history-empty';
      message.textContent = '暂无记录，完整播放一个示例后会显示在这里。';
      historyList.appendChild(message);
      return;
    }
    records.forEach(function (record) {
      var item = document.createElement('article');
      item.className = 'history-item';
      var title = document.createElement('div');
      var name = document.createElement('strong');
      name.textContent = record.name;
      var time = document.createElement('span');
      time.textContent = record.time + ' · 预设样例';
      title.append(name, time);
      var content = document.createElement('p');
      content.textContent = record.content;
      item.append(title, content);
      historyList.appendChild(item);
    });
  }

  function selectSkill(index) {
    clearResult();
    current = index;
    cards.forEach(function (card, i) {
      card.classList.toggle('active', i === index);
      card.setAttribute('aria-pressed', String(i === index));
    });
    var skill = SKILLS[index];
    head.querySelector('.skill-scene').textContent = skill.s;
    head.querySelector('h2').textContent = skill.n;
    form.replaceChildren();
    skill.f.forEach(function (field) {
      var label = document.createElement('label');
      label.className = 'field-row';
      var text = document.createElement('span');
      text.textContent = field[0] + (field[0] === '店铺名称' ? '（可替换）' : '（流程示例）');
      var control = document.createElement(field[2] === 'area' ? 'textarea' : 'input');
      if (field[2] === 'area') control.rows = 3;
      else control.type = 'text';
      control.placeholder = field[0];
      control.value = field[1];
      if (field[0] === '店铺名称') control.maxLength = 60;
      label.append(text, control);
      form.appendChild(label);
    });
    announce('已选择“' + skill.n + '”，可修改店名后播放预设样例。');
  }

  function run() {
    if (timer !== null) return;
    var skill = SKILLS[current];
    var shopName = form.querySelector('input').value.trim() || '示例茶餐厅';
    // 样例内容只做店名替换，其他字段不会被伪装成模型分析结果。
    var text = skill.n + '｜' + shopName + '（预设样例）\n\n' + skill.o.split('示例茶餐厅').join(shopName);
    var offset = 0;
    result = '';
    copyBtn.disabled = true;
    empty.hidden = true;
    empty.style.display = 'none';
    box.hidden = false;
    box.textContent = '';
    runBtn.disabled = true;
    runLabel.textContent = '正在播放…';
    work.setAttribute('aria-busy', 'true');
    announce('正在播放预设样例，切换技能或清空结果可停止。');

    function finish() {
      stopPlayback();
      result = text;
      box.textContent = text;
      copyBtn.disabled = false;
      records.unshift({name: skill.n, time: new Date().toLocaleTimeString('zh-CN', {hour12: false}), content: text});
      records = records.slice(0, HISTORY_LIMIT);
      renderHistory();
      announce('预设样例播放完成，可复制结果。');
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      finish();
      return;
    }
    timer = window.setInterval(function () {
      offset += PLAY_STEP;
      box.textContent = text.slice(0, offset);
      if (offset >= text.length) finish();
    }, PLAY_INTERVAL_MS);
  }

  SKILLS.forEach(function (skill, index) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'skill-card';
    var scene = document.createElement('span');
    scene.className = 'skill-scene';
    scene.textContent = skill.s;
    var title = document.createElement('strong');
    title.textContent = skill.n;
    var description = document.createElement('small');
    description.textContent = ['体验探店笔记草稿的生成流程。', '查看评价摘要的预设样例。', '查看商家回复的预设样例。', '查看优惠券推广文案样例。', '查看用于搜索与推荐的标签样例。', '查看经营数据日报的样例。', '查看本地生活短视频脚本样例。', '查看由商家确认后执行的活动草稿。'][index];
    card.append(scene, title, description);
    card.addEventListener('click', function () { selectSkill(index); });
    cards.push(card);
    rail.appendChild(card);
  });

  runBtn.addEventListener('click', run);
  document.getElementById('clear-result').addEventListener('click', function () {
    clearResult();
    announce('结果已清空，表单内容已保留。');
  });
  copyBtn.addEventListener('click', async function () {
    if (!result) return;
    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error('Clipboard unavailable');
      await navigator.clipboard.writeText(result);
      announce('已复制预设样例。');
    } catch (error) {
      var selection = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(box);
      selection.removeAllRanges();
      selection.addRange(range);
      box.focus();
      announce('浏览器未允许自动复制，结果已选中，请按 Ctrl+C，或长按选择复制。');
    }
  });
  document.getElementById('refresh-records').addEventListener('click', function () {
    renderHistory();
    announce('记录已刷新，本次会话共 ' + records.length + ' 条完整播放记录。');
  });
  var initialSkill = new URLSearchParams(window.location.search).get('skill');
  var initialIndex = SKILLS.findIndex(function (skill) { return skill.n === initialSkill; });
  selectSkill(initialIndex < 0 ? 0 : initialIndex);
  renderHistory();
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || !event.data || event.data.type !== 'portfolio:scene') return;
    var index = SKILLS.findIndex(function (skill) { return skill.n === event.data.target; });
    if (index >= 0) selectSkill(index);
  });
})();
</script>
</body>
</html>
